<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal | Vunoh Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="/dashboard/" class="nav-link">Staff Login →</a>
        </div>

        <!-- Input Section -->
        <div class="card">
            <h1>Vunoh Global 🇰🇪</h1>
            <p class="subtitle">Concierge & Task Management for Kenyans Abroad</p>
            
            <div class="input-grid">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="custName" placeholder="e.g. John Kamau">
                </div>
                <div class="input-group">
                    <label>WhatsApp / Phone</label>
                    <input type="text" id="custPhone" placeholder="e.g. +254 711...">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="custEmail" placeholder="e.g. john@example.com">
                </div>
            </div>

            <textarea id="requestInput" placeholder="Describe what you need help with in Kenya... (e.g., 'I need to pay school fees for my sister in Nairobi')"></textarea>
            <button onclick="submitRequest()" id="submitBtn" class="btn">Send</button>
            <div id="loader" class="loading">Analyzing your request...</div>

            <!-- Specific Task Result (Only visible after submission) -->
            <div id="resultsArea">
                <div class="success-banner">
                    <h2 id="resSuccessTitle">Task Created Successfully</h2>
                    <p style="margin-top: 0.5rem; color: var(--primary-dark); font-weight: 500;">Our team will communicate shortly.</p>
                </div>
                
                <p style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
                    Please save your Task Code for future reference.
                </p>
            </div>
        </div>
    </div>

    <script>
        async function submitRequest() {
            const message = document.getElementById('requestInput').value;
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const email = document.getElementById('custEmail').value;

            if (!message) return alert("Please specify your request details.");

            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('resultsArea');

            btn.disabled = true;
            loader.style.display = 'block';
            results.style.display = 'none';

            try {
                const response = await fetch('/api/process-request/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        customer_name: name || 'Valued Customer',
                        customer_phone: phone,
                        customer_email: email
                    })
                });
                const data = await response.json();

                if (data.status === 'success') {
                    displayResult(data);
                } else {
                    alert("Submission Failed: " + data.message);
                }
            } catch (err) {
                console.error(err);
                alert("Communication failure. Please check your connection.");
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function displayResult(data) {
            const results = document.getElementById('resultsArea');
            results.style.display = 'block';
            document.getElementById('resSuccessTitle').textContent = `Task ${data.task_code} Created`;
            results.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
